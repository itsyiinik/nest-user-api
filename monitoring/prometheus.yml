global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: user-service
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: /metrics

  - job_name: notification-service
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: /metrics
